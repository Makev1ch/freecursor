plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://maven.terraformersmc.com/" }
    maven { url = "https://maven.nucleoid.xyz/" }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        freecursor {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    // Key Mapping API is no longer bundled in the fabric-api umbrella on 26.1 — add it explicitly.
    // (Formerly fabric-key-binding-api-v1; renamed to fabric-key-mapping-api-v1 as of 26.1.)
    implementation "net.fabricmc.fabric-api:fabric-key-mapping-api-v1:${project.fabric_keymapping_version}"

    // ModMenu (optional at runtime) — used only for the config screen entrypoint
    compileOnly("com.terraformersmc:modmenu:18.0.0-beta.1")
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.base.archivesName.get()
    inputs.property "projectName", projectName
    from("LICENSE") {
        rename { "${it}_${projectName}"}
    }
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }

    repositories {
    }
}
